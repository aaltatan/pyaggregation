site_name: pyaggregation
site_description: Summaries over collections, computed in one pass. Composable with &, groupable by any key, and definable as JSON.
site_url: https://aaltatan.github.io/pyaggregation/
repo_url: https://github.com/aaltatan/pyaggregation
repo_name: aaltatan/pyaggregation
edit_uri: edit/main/docs/
copyright: GPL-3.0-only

theme:
  name: material
  icon:
    logo: material/sigma
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

# DESIGN.md records design decisions for contributors; it is kept out of the published site.
exclude_docs: |
  DESIGN.md

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Reports and &: guide/reports.md
      - Built-in aggregates: guide/builtins.md
      - Filtering and shares: guide/filtering.md
      - Grouping: guide/grouping.md
      - Money, Decimal and edge cases: guide/numbers.md
      - Your own aggregates: guide/custom.md
      - Compiling reports from JSON: guide/compiling.md
      - JSON Schema: guide/json-schema.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Report format: reference/format.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyaggregation
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyaggregation/
